version: '3.8'

services:
  # Database Service (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: flowspace-postgres
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: flowspace_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d flowspace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Nuxt FlowSpace Application Service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowspace-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://myuser:mypassword@db:5432/flowspace_db?schema=public
      - JWT_SECRET=change-me-to-a-very-secure-secret-key-12345
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
